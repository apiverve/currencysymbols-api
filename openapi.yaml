openapi: 3.0.4
info:
  title: Currency Symbols
  description: >-
    Currency Symbols matches ISO currency codes or country names to the
    countries that use them. Paid plans add the currency symbol, full currency
    name, ISO numeric code, decimal precision, and the currency's live rate and
    value against the US dollar.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/currencysymbols:
    get:
      summary: Currency Symbols
      description: Get the currency symbol and name of a currency
      operationId: currencysymbols
      parameters:
        - name: currency
          in: query
          schema:
            type: string
          required: true
          description: The currency code for which you want to get the symbol
          example: USD
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  countriesFound:
                    - country_name: AMERICAN SAMOA
                      currency_name: US Dollar
                      currency_iso_code: USD
